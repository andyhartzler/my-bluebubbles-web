<!DOCTYPE html><html><head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- CRITICAL: Viewport for fullscreen PWA -->
  <!-- FIX: Removed user-scalable=no and maximum-scale=1.0 which caused first-touch
       drop on iOS 16+ PWA after focus context switch. Using touch-action: manipulation
       in CSS instead to suppress 300ms tap delay without the side effects. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- CRITICAL: App name for iOS home screen -->
  <meta name="apple-mobile-web-app-title" content="MOYD App">
  <meta name="application-name" content="MOYD App">

  <!-- iOS PWA Configuration -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Android PWA Configuration -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1a1a2e">

  <!-- Prevent auto-detection -->
  <meta name="format-detection" content="telephone=no">

  <!-- Description -->
  <meta name="description" content="Missouri Young Democrats CRM">

  <!-- SEO robots -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="googlebot" content="noindex, nofollow">
  <meta http-equiv="X-Robots-Tag" content="noindex, nofollow">

  <!-- Sentry browser SDK: warm the connection and start the download early.

       initSentry() is the FIRST await inside runZonedGuarded in main(), before
       runApp, and on web SentryFlutter.init's WebSdkIntegration appends a
       <script> tag for the URL below and AWAITS its onload. So first paint used
       to wait on DNS + TLS + download + parse of a third-party host nothing else
       in the app talks to. These two hints overlap that with Flutter engine boot,
       so the loader's own script tag resolves from cache.

       This is a pure timing change: the SDK still loads, with identical
       monitoring coverage. If it is unreachable the hints are inert, exactly as
       the loader already is.

       VERSION PIN: must match `sentryJsSdkVersion` in
       sentry_flutter/lib/src/web/sentry_js_sdk_version.dart (10.38.0 for
       sentry_flutter 9.24.0). RE-CHECK IT ON EVERY sentry_flutter BUMP: a stale
       version here does not break anything, it just preloads a file nobody
       asks for, and the browser will warn about an unused preload.

       The integrity hash and crossorigin must match what the loader sets on
       its own <script> (crossOrigin='anonymous' plus `productionIntegrity`
       from sentry_js_sdk_version.dart), or the browser will not reuse the
       preloaded response. A mismatch costs the speedup, not correctness. -->
  <link rel="preconnect" href="https://browser.sentry-cdn.com" crossorigin>
  <link rel="preload" as="script" crossorigin
        integrity="sha384-COL1vOWQO+0hwStGhZ6r5BKlWlJzd59gOqtCYmcIvfDd0ifnTHrWzzQQYmUNf/Lr"
        href="https://browser.sentry-cdn.com/10.38.0/bundle.tracing.min.js">

  <!-- Apple Touch Icon -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="icons/favicon.ico">

  <!-- Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- CRITICAL: Page title (shows in browser tab and as fallback name) -->
  <title>MOYD App</title>

  <!-- Google auth details -->
  <meta name="google-signin-client_id" content="500464701389-8trcdkcj7ni5l4dn6n7l795rhb1asnh3.apps.googleusercontent.com">

  <!-- Warm the connections every boot actually uses, so the first request on
       each pays a DNS lookup and a TLS handshake it has already done.
       Supabase: every CRM screen queries it immediately after auth.
       Sentry CDN: sentry_flutter's WebSdkIntegration downloads the browser SDK
       from here inside initSentry(), which main.dart awaits BEFORE runApp, so
       this handshake is on the critical path to first paint.
       Deliberately NOT preconnected: cdn.apple-mapkit.com (now on demand, see
       below) and cdn.plaid.com (deferred and only used long after boot).
       `crossorigin` is required on the Supabase entry: its requests are CORS
       fetches, and a preconnect without it opens a connection in the wrong
       pool that the real request cannot reuse. -->
  <link rel="preconnect" href="https://faajpcarasilbfndzkmd.supabase.co" crossorigin>
  <link rel="dns-prefetch" href="https://faajpcarasilbfndzkmd.supabase.co">
  <link rel="preconnect" href="https://browser.sentry-cdn.com" crossorigin>

  <!-- MapKit is injected on demand, so no preconnect here: that would open a
       TLS connection on every boot for the many screens that never show a map,
       which is the cost this change exists to remove. dns-prefetch is the
       cheap half: it resolves the name without a handshake, so the first map
       view skips the DNS leg of an otherwise cold start. -->
  <link rel="dns-prefetch" href="https://cdn.apple-mapkit.com">

  <!-- Apple MapKit JS — loaded ON DEMAND rather than on every page load.
       The Dart contract is unchanged. lib/widgets/event_map_widget.dart calls
       js.context.callMethod('whenMapKitReady', [cb]) and, when cb fires, reads
       window.mapkit / window.mapkit.init directly. The only difference is that
       the CDN script is injected the FIRST time whenMapKitReady is called
       instead of on every boot, so CRM screens with no map never pay the
       cross-origin DNS + TLS + download + parse.

       Readiness condition, failure behaviour and callback ordering are all
       preserved: a queued callback fires only once window.mapkit.init exists,
       and on load failure it is never invoked, exactly as the old poll did
       when it gave up. -->
  <script>
    (function () {
      var MAPKIT_SRC = 'https://cdn.apple-mapkit.com/mk/5.x.x/mapkit.core.js';
      var MAPKIT_LIBRARIES = 'map,annotations,services';
      var READY_TIMEOUT_MS = 10000;
      var POLL_INTERVAL_MS = 50;

      var callbacks = [];
      var injected = false;
      var ready = false;

      // Readiness must be gated on the constructors the Dart side actually
      // dereferences, NOT on `init` alone. window.mapkit and mapkit.init are
      // defined by mapkit.core.js as it parses, but Geocoder, Map,
      // MarkerAnnotation, Coordinate, CoordinateSpan, CoordinateRegion and
      // FeatureVisibility arrive from the separate `map`, `annotations` and
      // `services` bundles that core fetches afterwards.
      //
      // Under the old eager <script defer> those bundles had the whole
      // boot-to-navigation window to arrive before any map mounted. Loading on
      // demand removes that slack, so resolving on `init` alone would hand the
      // callback to lib/widgets/event_map_widget.dart while mapkit['Geocoder']
      // (line 225) is still undefined, and the map would fail to render.
      //
      // waitForGlobal polls every 50 ms to a 10 s deadline, so this simply
      // waits a few hundred ms longer. There is no deadlock: data-libraries
      // makes core load these without mapkit.init() having to be called first.
      var REQUIRED = [
        'init', 'Map', 'Geocoder', 'MarkerAnnotation',
        'Coordinate', 'CoordinateSpan', 'CoordinateRegion', 'FeatureVisibility'
      ];

      function usable() {
        if (!window.mapkit) return false;
        for (var i = 0; i < REQUIRED.length; i++) {
          if (!window.mapkit[REQUIRED[i]]) return false;
        }
        return true;
      }

      function flush() {
        ready = true;
        var pending = callbacks;
        callbacks = [];
        for (var i = 0; i < pending.length; i++) {
          try {
            pending[i]();
          } catch (err) {
            console.error('[MapKit] ready callback threw', err);
          }
        }
      }

      // mapkit.core.js defines window.mapkit as it parses, but poll briefly
      // anyway so a slow global assignment cannot drop the callbacks.
      function waitForGlobal(deadline) {
        if (usable()) {
          flush();
          return;
        }
        if (Date.now() >= deadline) {
          console.warn('[MapKit] script loaded but window.mapkit.init never appeared; map will not render');
          return;
        }
        setTimeout(function () { waitForGlobal(deadline); }, POLL_INTERVAL_MS);
      }

      function inject() {
        injected = true;
        var script = document.createElement('script');
        script.src = MAPKIT_SRC;
        script.crossOrigin = 'anonymous';
        script.async = true;
        // MapKit reads this off its own script element via document.currentScript,
        // which is populated for dynamically inserted classic scripts too.
        script.setAttribute('data-libraries', MAPKIT_LIBRARIES);
        script.addEventListener('load', function () {
          waitForGlobal(Date.now() + READY_TIMEOUT_MS);
        });
        script.addEventListener('error', function () {
          console.error('[MapKit] failed to load ' + MAPKIT_SRC);
        });
        document.head.appendChild(script);
      }

      // Called from Dart: js.context.callMethod('whenMapKitReady', [callback]).
      window.whenMapKitReady = function (callback) {
        if (typeof callback !== 'function') {
          return;
        }
        if (ready && usable()) {
          callback();
          return;
        }
        callbacks.push(callback);
        if (!injected) {
          inject();
        }
      };
    })();
  </script>

  <script>
    // The value below is injected by flutter build, do not touch.
    // Flutter ≥3.41 substitutes this token as `"<hash>" /* deprecation comment */`,
    // so it must NOT be wrapped in quotes (the comment contains an apostrophe).
    const serviceWorkerVersion = {{flutter_service_worker_version}};
  </script>
  <!-- Plaid Link JS SDK (required for plaid_flutter on web) — deferred so
       it never blocks first paint; only used long after boot. -->
  <script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js" defer></script>

  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer=""></script>

  <style>
    /* Suppress 300ms tap delay on mobile without user-scalable=no side effects */
    * { touch-action: manipulation; }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #0d0d1a;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #0d0d1a;
      }
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
</head>
<body>
  <picture id="splash">
      <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
      <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
      <img class="center" aria-hidden="true" fetchpriority="high" src="splash/img/light-1x.png" alt="">
  </picture>

  <script>
    function showInitializationError(message) {
      removeSplashFromWeb();

      let errorContainer = document.getElementById('flutter-init-error');

      if (!errorContainer) {
        errorContainer = document.createElement('div');
        errorContainer.id = 'flutter-init-error';
        errorContainer.style.cssText = [
          'position: fixed',
          'inset: 0',
          'display: flex',
          'align-items: center',
          'justify-content: center',
          'background: #0b0b0f',
          'color: #f5f5f7',
          'padding: 24px',
          'text-align: center',
          'font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif',
        ].join(';');

        const messageBox = document.createElement('div');
        messageBox.style.cssText = [
          'max-width: 640px',
          'background: rgba(255, 255, 255, 0.04)',
          'border: 1px solid rgba(255, 255, 255, 0.12)',
          'border-radius: 12px',
          'padding: 24px',
          'box-shadow: 0 12px 48px rgba(0, 0, 0, 0.28)',
        ].join(';');

        const title = document.createElement('h2');
        title.textContent = 'MOYD App failed to load';
        title.style.margin = '0 0 12px 0';

        const body = document.createElement('p');
        body.id = 'flutter-init-error-message';
        body.style.margin = '0';

        messageBox.appendChild(title);
        messageBox.appendChild(body);
        errorContainer.appendChild(messageBox);
        document.body.appendChild(errorContainer);
      }

      const messageElement = document.getElementById('flutter-init-error-message');
      if (messageElement) {
        messageElement.textContent = message;
      }
    }

    // iOS PWA bfcache restore guard.
    // When the user closes the home-screen PWA and reopens it, iOS often
    // serves the page from back-forward cache: the DOM is restored intact
    // but the Flutter pointer-router listeners installed during the
    // previous JS context are orphaned. Symptom: hamburger menu (and
    // every other tap target) renders normally but produces no events.
    // Multiple prior fixes (removed FocusableActionDetector / Focus
    // autofocus / SelectionArea on mobile / user-scalable=no) addressed
    // first-load issues but didn't cover the bfcache resume case.
    //
    // The standard fix: detect `event.persisted === true` on `pageshow`
    // and force a fresh navigation. ~500ms reload flash on resume is
    // worth it vs. a frozen-tap UI. Safari's top-level page handles
    // this differently — only PWAs in standalone mode hit the broken
    // path, hence the standalone gate so we don't regress regular
    // Safari behavior.
    window.addEventListener('pageshow', function (event) {
      const isStandalonePWA =
        (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
        window.navigator.standalone === true;
      if (!isStandalonePWA) return;

      if (event.persisted === true) {
        // True bfcache restore — DOM is alive but Flutter listeners are
        // orphaned. Hardest case; full reload.
        window.location.reload();
        return;
      }

      // Cold relaunch: the real root cause of the dead-hamburger-on-first-open
      // bug is stale safe-area/viewport metrics, not a phantom pointer arena.
      // That is now handled by re-reading the viewport after runApp (see the
      // standalone resize nudge in the entrypoint) plus the Dart-side
      // didChangeMetrics/relayout burst. The previous synthetic-pointercancel
      // hack (predicated on the phantom-pointer theory) was refuted by the tap
      // telemetry and is removed — it never helped and dispatching a synthetic
      // pointercancel at the document root on every relaunch is a needless risk
      // to real gesture routing.
    });

    window.addEventListener('load', function () {
      const loader = window._flutter?.loader;
      if (!loader) {
        console.error('Flutter loader not found. Ensure flutter.js is loaded.');
        showInitializationError('MOYD App could not start because a required file failed to load. Please refresh the page or try a different browser.');
        return;
      }

      loader
        .loadEntrypoint({
          serviceWorker: {
            serviceWorkerVersion: serviceWorkerVersion,
          },
          onEntrypointLoaded: function (engineInitializer) {
            // There is no HTML renderer in Flutter 3.41: WebRendererMode has
            // exactly two values, canvaskit and skwasm, and the engine ignores
            // config.renderer entirely (requestedRendererType in
            // lib/web_ui/lib/src/engine/configuration.dart has no consumers
            // anywhere in the engine). The branch this replaced asked for
            // 'html' on every iPhone and iPad, which has been dead config
            // since that renderer was removed, and it built a throwaway canvas
            // and WebGL context on every boot to decide it. Both are gone; the
            // engine picks canvaskit either way, which is what already shipped.
            engineInitializer
              .initializeEngine({ useColorEmoji: true })
              .then(function (appRunner) {
                removeSplashFromWeb();
                appRunner.runApp();
                // iOS standalone PWA cold launch finalizes the viewport /
                // safe-area insets lazily and may not emit the resize that
                // makes Flutter re-read them. Nudge WebKit to recompute the
                // viewport a few times so the engine fires metricschanged and
                // the app relays out the top bar against correct insets before
                // the first tap — fixes the "hamburger dead until I tap a card"
                // bug. Timed AFTER runApp so the engine's metrics listener is
                // attached. Only in standalone; a normal Safari tab is fine.
                try {
                  var __standalone =
                    (window.matchMedia &&
                      window.matchMedia('(display-mode: standalone)').matches) ||
                    window.navigator.standalone === true;
                  if (__standalone) {
                    [100, 400, 900].forEach(function (ms) {
                      setTimeout(function () {
                        try {
                          window.scrollTo(0, 0);
                          window.dispatchEvent(new Event('resize'));
                        } catch (_) {}
                      }, ms);
                    });
                  }
                } catch (_) {}
              })
              .catch(function (err) {
                console.error('Failed to initialize Flutter engine', err);
                showInitializationError('MOYD App could not start because your browser is missing required capabilities. Please refresh the page or try a different device or browser.');
              });
          },
        })
        .catch(function (err) {
          console.error('Failed to load Flutter entrypoint', err);
          showInitializationError('MOYD App could not start because critical resources failed to load. Please refresh the page and try again.');
        });
    });
  </script>


</body></html>
