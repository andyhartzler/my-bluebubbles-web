    # `assets/tmail/` to avoid colliding with bluebubbles' own
    # `assets/images/` (different file set). The path constants in
    # `lib/features/mail/_tmail/core/presentation/resources/assets_paths.dart`
    # point here. Without these declarations every SvgPicture.asset() in
    # tmail's UI throws "Invalid SVG data" because the bytes can't load.
    - assets/tmail/images/
    - assets/tmail/icons/
    - assets/tmail/animations/
