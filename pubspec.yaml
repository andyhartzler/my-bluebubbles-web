  json_serializable: ^6.7.1  # jmap_dart_client pins 6.6.1; bluebubbles uses ^6.7.1
  json_annotation: ^4.9.0  # bluebubbles version, supersedes tmail's 4.8.0
  dio: ^5.4.2+1  # jmap_dart_client wants 5.2.0; pin to ours (forwards-compat)
  build_runner: ^2.4.12  # jmap_dart_client pins 2.4.10; ours newer
