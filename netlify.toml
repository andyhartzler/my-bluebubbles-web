[build]
  command = "bash netlify-build.sh"
  publish = "build/web"

[build.environment]
  # Use Ubuntu 22.04 (Jammy) for GLIBCXX_3.4.30 required by Flutter 3.24/Dart 3.5
  NETLIFY_USE_JAMMY = "true"
  # Flutter requires Git
  GIT_LFS_ENABLED = "true"
  # Pin the Flutter version so Netlify uses the same toolchain as local builds
  FLUTTER_VERSION = "3.24.4"

[[redirects]]
  # Handle client-side routing
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    # Update these credentials in your Netlify environment before deploying.
    Basic-Auth = "admin:CHANGE_ME"
