[build]
  command = "bash netlify-build.sh"
  # Skip the build when no file that can affect build/web changed.
  # See netlify-should-build.sh for the measurement that motivated it.
  ignore = "bash netlify-should-build.sh"
  publish = "build/web"

[build.environment]
  # Use Ubuntu 22.04 (Jammy) for GLIBCXX required by recent Flutter/Dart
  NETLIFY_USE_JAMMY = "true"
  # Flutter requires Git
  GIT_LFS_ENABLED = "true"
  # Bumped 2026-04-29 to match the SDK upgrade (Dart 3.7+ wildcard `_`,
  # dart:js_util migrations, freezed 3.x abstract classes).
  FLUTTER_VERSION = "3.41.8"

[[redirects]]
  # Handle client-side routing
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"

# Boot-critical files must always revalidate so deploys take effect
# immediately. NOTE: main.dart.js and *.part.js are NOT content-hashed —
# leave them at Netlify's default max-age=0,must-revalidate and never mark
# them immutable.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/flutter_bootstrap.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache"

# Heavy, rarely-changing assets (incl. the 7.2MB canvaskit.wasm): serve from
# browser cache for a week instead of a revalidation round trip per visit.
[[headers]]
  for = "/canvaskit/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/splash/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
